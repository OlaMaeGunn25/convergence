# =============================================================================
# CONVERGENCE-Ai — ON-PREM / SELF-HOSTED deployment (DEP)
#
# Runs the whole hub with NO mandatory external cloud dependency. All governed
# state (tasks, agents, connections, HITL identities, attribution, knowledge base,
# autonomy grants, chat plans, compliance evidence, HR requests) persists in local
# Docker volumes via the JSON store; the orchestrator + 13-agent roster run
# identically to the cloud build (mode is config, not a code fork — DEP-03).
#
#   cp .env.onprem.example .env.onprem   # then edit secrets
#   docker compose -f docker-compose.onprem.yml up -d
#   curl -H "x-api-key: <key>" http://localhost:3003/health   # deployment.mode == onprem
# =============================================================================

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile          # single-container image (Node 20 + Chromium)
    image: convergence-ai:onprem
    env_file: .env.onprem
    environment:
      DEPLOYMENT_MODE: onprem
      NODE_ENV: production
      PORT: "3003"
    ports:
      - "3003:3003"
    volumes:
      - convergence_state:/app/aiwx-smb-auditor/config        # governed JSON state
      - convergence_audits:/app/aiwx-smb-auditor/audits_cache
      - convergence_data:/data
    depends_on:
      - postgres
    restart: unless-stopped

  # Local Postgres + pgvector — backs the RAG knowledge base (and Dify, if added).
  # The gateway's own governed state does NOT require this (it uses the JSON store);
  # it is here for the vector store + any self-hosted Supabase you point the gateway at.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: convergence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: convergence
    volumes:
      - convergence_pg:/var/lib/postgresql/data
    restart: unless-stopped

  # n8n workflow runner (bookkeeping / integration workflows). Optional.
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: ${TZ:-UTC}
    ports:
      - "5678:5678"
    volumes:
      - convergence_n8n:/home/node/.n8n
    restart: unless-stopped

# NOTE: Dify.ai (the RAG brain) ships its own Docker Compose stack — run it
# alongside this one and point it at the `postgres` service above. See
# docs/DEPLOYMENT_ONPREM.md. For multi-instance on-prem, run self-hosted Supabase
# and set SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY in .env.onprem instead of the
# local JSON store.

volumes:
  convergence_state:
  convergence_audits:
  convergence_data:
  convergence_pg:
  convergence_n8n:
