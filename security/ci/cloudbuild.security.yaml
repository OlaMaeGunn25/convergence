# Cloud Build — Tier 4 supply-chain gate for the GCP container target.
# Build -> OPA tests -> SBOM + provenance -> scan -> cosign sign -> attest -> Binary Authorization
# admits only the resulting attested image. AWS equivalent: the same steps with cosign + ECR and
# Kyverno/OPA Gatekeeper admission (see security/README.md).

steps:
  # 1) Zero-trust policy tests must pass before we build anything.
  - id: opa-tests
    name: openpolicyagent/opa:latest
    args: ["test", "security/opa", "-v"]

  # 2) Guardrail coverage — every vertical has a declaration (SGoT-5).
  - id: guardrail-coverage
    name: node:20
    entrypoint: node
    args: ["security/scripts/check_guardrail_coverage.mjs"]

  # 3) Build the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

  # 4) SBOM + vulnerability scan (fail on critical).
  - id: scan
    name: gcr.io/cloud-builders/gcloud
    args: ["artifacts", "docker", "images", "scan", "${_IMAGE}", "--format=json"]

  # 5) cosign sign + attestations (review / scan / provenance / opa).
  - id: sign-and-attest
    name: gcr.io/projectsigstore/cosign
    entrypoint: sh
    args:
      - -c
      - |
        cosign sign --yes ${_IMAGE}
        cosign attest --yes --predicate opa-passed.json   --type custom ${_IMAGE}
        cosign attest --yes --predicate scan-passed.json  --type custom ${_IMAGE}
        cosign attest --yes --predicate provenance.json   --type slsaprovenance ${_IMAGE}

  # 6) Deploy — Binary Authorization (security/binary-authorization/policy.yaml) admits ONLY
  #    images carrying all required attestations; unsigned/unattested images are refused here.
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args: ["run", "deploy", "convergence", "--image", "${_IMAGE}", "--region", "${_REGION}",
           "--binary-authorization", "default", "--no-allow-unauthenticated"]

substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/PROJECT_ID/convergence/app:$SHORT_SHA"
  _REGION: "us-central1"

options:
  requestedVerifyOption: VERIFIED
  logging: CLOUD_LOGGING_ONLY
